name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 4 * * 1' # Se ejecuta todos los lunes a las 4:30 UTC

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Configurar el entorno de Java 17 necesario para Quarkus
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' # O 'azul', 'corretto' según tus preferencias
        cache: 'maven'          # Agiliza las descargas de dependencias en futuras ejecuciones

    # 2. Inicializar las herramientas de CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'java-kotlin'
        # Opcional: puedes elegir 'security-extended' o 'security-and-quality' para análisis más profundos
        queries: security-and-quality 

    # 3. Compilar los microservicios
    # Quarkus requiere compilación completa para que CodeQL registre todo el flujo de datos
    - name: Build Quarkus Application
      run: mvn clean package -DskipTests

    # 4. Ejecutar el análisis de CodeQL
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:java-kotlin"
